name: Build plugins

# Pushes to any branch: build + QA every plugin, upload installers as an artifact.
# Releases (GitHub Release "<Plugin> <version>", tag <Plugin>-v<version>) happen when:
#   - a push to main contains a plugin with "publish": true in its site.json whose VERSION has no release yet
#     (so shipping an update = bump VERSION in plugins/<Plugin>/CMakeLists.txt and push), or
#   - Actions tab > Build plugins > Run workflow on main with release = <Plugin>, or
#   - a pushed tag "<Plugin>-v<version>".
# Pushes to main and releases also rebuild the download site (gh-pages -> ddeonmadeit.github.io/plugins-).

on:
  push:
    branches: ["**", "!gh-pages"]
    tags: ["*-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Plugin to release (e.g. SubGrit). Leave empty to just build."
        required: false
        default: ""

# A newer push cancels an older push build of the same branch; release runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write   # publish releases and push the gh-pages branch

jobs:
  # Sample-based plugins (plugins/<Name>/library/build_library.py) get their sound library built once,
  # from the sources it downloads, and cached; QA and the macOS installers restore it from the cache.
  libraries:
    name: Sample libraries
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: echo "key=sample-libraries-v1-${{ hashFiles('plugins/*/library/**') }}" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: libraries
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true

      - name: Build sample libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip python3-numpy python3-scipy python3-soundfile
          mkdir -p libraries
          for builder in plugins/*/library/build_library.py; do
            [[ -f "$builder" ]] || continue
            p=$(basename "$(dirname "$(dirname "$builder")")")
            python3 "$builder" --kits "$RUNNER_TEMP/kits" --out "libraries/$p" --download --discard-kits --jobs 3
          done
          du -sh libraries/*

      - name: Save sample libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libraries
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

  linux-qa:
    name: Linux QA (presets, audio analysis, pluginval)
    needs: libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore sample libraries
        uses: actions/cache/restore@v4
        with:
          path: libraries
          key: ${{ needs.libraries.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Point plugins at their libraries
        run: |
          # Kitroom reads $KITROOM_LIBRARY, and so on for any future sample-based plugin.
          for d in libraries/*/; do
            [[ -d "$d" ]] || continue
            p=$(basename "$d")
            echo "$(echo "$p" | tr '[:lower:]' '[:upper:]')_LIBRARY=$PWD/libraries/$p" >> "$GITHUB_ENV"
          done

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb ffmpeg libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            python3-numpy python3-scipy python3-soundfile python3-matplotlib

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build harnesses and VST3s
        run: |
          targets=""
          for p in $(python3 tools/ci/plugin_meta.py --names); do targets="$targets ${p}_Harness ${p}_VST3"; done
          cmake --build build --parallel --target $targets

      - name: Get pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip -d pluginval

      - name: QA every plugin
        run: |
          for p in $(python3 tools/ci/plugin_meta.py --names); do
            PLUGINVAL=$PWD/pluginval/pluginval tools/qa/run_qa.sh "$p"
          done

      - name: Render previews for the download site
        run: |
          for p in $(python3 tools/ci/plugin_meta.py --names); do
            python3 tools/site/make_previews.py "$p" site-previews
          done

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: site-previews
          path: site-previews

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa-out/*/analysis.txt
            qa-out/*/stress.txt
            qa-out/*/ui.png
            qa-out/*/renders/sheet.png
            qa-out/*/renders/report.json
            qa-out/*/pluginval.log

  macos:
    name: macOS universal (VST3 + AU)
    needs: libraries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore sample libraries
        uses: actions/cache/restore@v4
        with:
          path: libraries
          key: ${{ needs.libraries.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Point plugins at their libraries
        run: |
          for d in libraries/*/; do
            [[ -d "$d" ]] || continue
            p=$(basename "$d")
            echo "$(echo "$p" | tr '[:lower:]' '[:upper:]')_LIBRARY=$PWD/libraries/$p" >> "$GITHUB_ENV"
          done

      - name: Pick plugins
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          set -eo pipefail
          meta() { python3 tools/ci/plugin_meta.py --only "$1" | python3 -c "import json,sys; p=json.load(sys.stdin)[0]; print($2)"; }
          released() { gh release view "$1" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; }
          releases=""; only=""
          if [[ "$GITHUB_REF" == refs/tags/*-v* ]]; then
            plugin="${GITHUB_REF_NAME%-v*}"; version="${GITHUB_REF_NAME##*-v}"
            python3 tools/ci/plugin_meta.py --only "$plugin" > /dev/null || { echo "::error::No plugin named '$plugin' in plugins/"; exit 1; }
            declared=$(meta "$plugin" "p['version']")
            [[ "$declared" == "$version" ]] || { echo "::error::Tag says $plugin $version but its CMakeLists.txt says VERSION $declared"; exit 1; }
            releases="$plugin"; only="$plugin"
          elif [[ -n "$RELEASE_INPUT" ]]; then
            python3 tools/ci/plugin_meta.py --only "$RELEASE_INPUT" > /dev/null || { echo "::error::No plugin named '$RELEASE_INPUT' in plugins/"; exit 1; }
            version=$(meta "$RELEASE_INPUT" "p['version']")
            ! released "$RELEASE_INPUT-v$version" || { echo "::error::$RELEASE_INPUT $version is already released. Bump VERSION first."; exit 1; }
            releases="$RELEASE_INPUT"; only="$RELEASE_INPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Release on version bump: every plugin with "publish": true in site.json whose VERSION has no release yet.
            for p in $(python3 tools/ci/plugin_meta.py --names); do
              if [[ "$(meta "$p" "p['site'].get('publish', False)")" == True ]] && ! released "$p-v$(meta "$p" "p['version']")"; then
                releases="$releases $p"
              fi
            done
          fi
          if [[ -n "$only" ]]; then echo "DD_ONLY=$only" >> "$GITHUB_ENV"; fi
          echo "RELEASES=$(echo $releases)" >> "$GITHUB_ENV"
          echo "PLUGINS=$(python3 tools/ci/plugin_meta.py ${only:+--only $only} --names | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "Building: $(python3 tools/ci/plugin_meta.py ${only:+--only $only} --names | tr '\n' ' ')  Releasing: $(echo ${releases:-nothing})"

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-macos-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (arm64 + x86_64)
        run: |
          brew install ninja || true
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDD_BUILD_HARNESS=OFF \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          targets=""
          for p in $PLUGINS; do targets="$targets ${p}_VST3 ${p}_AU"; done
          cmake --build build --parallel --target $targets

      - name: Sign and package
        run: tools/ci/package_macos.sh build dist libraries

      - name: Validate Audio Units (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          python3 - <<'PY' > au_list.txt
          import json
          for p in json.load(open("dist/plugins.json")):
              print(p["target"], p["product"], p["au_type"], p["code"], p["manufacturer"])
          PY
          while read -r target product type code manu; do
            ditto "build/plugins/$target/${target}_artefacts/Release/AU/$product.component" "$HOME/Library/Audio/Plug-Ins/Components/$product.component"
          done < au_list.txt
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          while read -r target product type code manu; do
            auval -v "$type" "$code" "$manu"
          done < au_list.txt

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          for p in $PLUGINS; do
            product=$(python3 -c "import json; print({x['target']: x['product'] for x in json.load(open('dist/plugins.json'))}['$p'])")
            pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
              --timeout-ms 600000 --validate "build/plugins/$p/${p}_artefacts/Release/VST3/$product.vst3"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: macOS-installers
          path: |
            dist/*.pkg
            dist/*.zip

      - name: Publish GitHub Releases
        if: env.RELEASES != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          for p in $RELEASES; do
            version=$(python3 tools/ci/plugin_meta.py --only "$p" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['version'])")
            python3 tools/site/release_notes.py "$p" "$version" > "dist/$p-notes.md"
            gh release create "$p-v$version" "dist/$p-$version-macOS.pkg" "dist/$p-$version-macOS.zip" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$p $version" --notes-file "dist/$p-notes.md"
          done

  site:
    name: Download site (GitHub Pages)
    needs: [linux-qa, macos]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download previews
        uses: actions/download-artifact@v4
        with:
          name: site-previews
          path: site-previews

      - name: Build site from the current releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          python3 tools/site/build_site.py --releases releases.json --previews site-previews --out _site --repo "$GITHUB_REPOSITORY"

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Download site for ${GITHUB_SHA::7}"
          # Single-commit branch: the page and its audio are regenerated every time, history adds nothing.
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
